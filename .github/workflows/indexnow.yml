# Tells Bing (and the other IndexNow engines) about every page in the sitemap after each deploy of docs/.
# The key file docs/<key>.txt is served at https://intellumia.com/<key>.txt.
name: IndexNow ping

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find the key
        id: key
        run: |
          key=$(ls docs | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          test -n "$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Wait for the deploy to serve the key file
        run: |
          for i in $(seq 1 30); do
            if [ "$(curl -fsS "https://intellumia.com/${{ steps.key.outputs.key }}.txt" || true)" = "${{ steps.key.outputs.key }}" ]; then
              echo "key file live"; exit 0
            fi
            sleep 20
          done
          echo "key file not live after 10 minutes"; exit 1
      - name: Ping IndexNow with the sitemap URLs
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' docs/sitemap.xml | sed -e 's/<loc>//' -e 's/<\/loc>//' | jq -R . | jq -s .)
          body=$(jq -n --arg key "${{ steps.key.outputs.key }}" --argjson urls "$urls" \
            '{host: "intellumia.com", key: $key, keyLocation: ("https://intellumia.com/" + $key + ".txt"), urlList: $urls}')
          echo "$body"
          curl -sS -o /dev/null -w '%{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body" | tee status.txt
          grep -Eq '^(200|202)$' status.txt
